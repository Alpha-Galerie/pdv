<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club Alpha PDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0c;--bg2:#141416;--bg3:#1c1c1f;--bg4:#26262a;
  --line:#2a2a2e;--line2:#38383d;
  --gold:#c9a961;--gold2:#e2c47c;--goldbg:rgba(201,169,97,.12);
  --text:#f3efe6;--dim:#8d8a84;--dim2:#b5b1a9;
  --green:#3ecf74;--greenbg:rgba(62,207,116,.12);
  --red:#ef5350;--redbg:rgba(239,83,80,.12);
  --orange:#f5a524;--blue:#5aa9ff;--bluebg:rgba(90,169,255,.12);
  --r:10px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:11px 13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.mono{font-family:'JetBrains Mono',monospace}
.hidden{display:none!important}

/* ── LOGIN ── */
#telaLogin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#1d1a12,#0b0b0c 60%);z-index:500}
.login-box{width:100%;max-width:360px;padding:32px;background:var(--bg2);border:1px solid var(--line);border-radius:16px}
.login-box h1{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--gold);text-align:center;font-weight:600}
.login-box h1 em{font-style:italic}
.login-box p{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.15em;margin:4px 0 24px}
.login-box label{display:block;font-size:11px;letter-spacing:.12em;color:var(--dim2);margin:0 0 6px;text-transform:uppercase}
.login-box input{margin-bottom:14px}
.login-erro{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}

/* ── APP ── */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--gold);white-space:nowrap;margin-right:8px}
.brand em{font-style:italic}
.tb-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--line2);font-size:13px;font-weight:600;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold)}
.tb-btn.ativo{background:var(--gold);color:#111;border-color:var(--gold)}
.tb-btn .cnt{background:var(--gold);color:#111;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800}
.tb-btn.ativo .cnt{background:#111;color:var(--gold)}
.tb-btn kbd{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.6;font-weight:500}
.tb-spacer{flex:1}
.tb-info{font-size:12px;color:var(--dim2);text-align:right;line-height:1.3;white-space:nowrap}
.tb-info b{color:var(--text);font-weight:600}
.sync{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.sync.off{background:var(--red);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}

.main{display:grid;grid-template-columns:190px 1fr 400px;min-height:0}
@media (max-width:1180px){.main{grid-template-columns:150px 1fr 350px}}

/* categorias */
.cats{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 12px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--dim2);margin-bottom:3px}
.cat:hover{background:var(--bg3);color:var(--text)}
.cat.ativo{background:var(--gold);color:#111}
.cat small{font-weight:500;opacity:.6;font-size:11px}
.cat.voltar{color:var(--gold);text-transform:none;font-weight:600}
.cat-sep{height:1px;background:var(--line);margin:8px 4px}

/* produtos */
.centro{display:flex;flex-direction:column;min-height:0}
.busca-bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.busca-bar .busca{flex:1;font-size:16px;padding:12px 14px}
.busca-bar .cod{width:180px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim2);white-space:nowrap;cursor:pointer;user-select:none}
.chk input{width:auto}
.btn-avulso{padding:11px 14px;border-radius:8px;background:var(--bg3);border:1px dashed var(--line2);font-size:13px;font-weight:600;white-space:nowrap}
.btn-avulso:hover{border-color:var(--gold);color:var(--gold)}
.grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;align-content:start}
.tile{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 10px;text-align:center;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s,border-color .15s}
.tile:hover{border-color:var(--gold)}
.tile:active{transform:scale(.97)}
.tile .nome{font-size:12.5px;font-weight:700;line-height:1.3;text-transform:uppercase;letter-spacing:.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .cod{color:var(--dim);font-weight:500}
.tile .preco{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--gold);font-weight:700}
.tile .preco small{display:block;font-size:10px;color:var(--dim);font-weight:500}
.tile .est{font-size:10.5px;color:var(--dim);font-weight:600}
.tile .est.baixo{color:var(--orange)}
.tile.zerado{opacity:.75}
.tile .sem{background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px;border-radius:5px}
.tile .var-tag{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:.05em}
.tile .qtd-no-ticket{position:absolute;top:-7px;right:-7px;background:var(--green);color:#111;min-width:24px;height:24px;border-radius:12px;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.vazio{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
.vazio b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* comandas */
.comandas{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-content:start}
.cmd{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.cmd:hover{border-color:var(--gold)}
.cmd.ativa{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldbg)}
.cmd .hd{background:var(--red);color:#fff;padding:9px 12px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmd .hd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .hd small{font-weight:600;font-size:11px;opacity:.85;white-space:nowrap}
.cmd .bd{padding:10px 12px;font-size:12px;color:var(--dim2);line-height:1.7}
.cmd .bd .tot{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--gold);font-weight:700}
.cmd.nova{border:2px dashed var(--line2);align-items:center;justify-content:center;min-height:130px;color:var(--gold);font-weight:700;font-size:15px;background:transparent}
.cmd.nova:hover{border-color:var(--gold);background:var(--goldbg)}

/* ticket */
.ticket{display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--line);min-height:0}
.tk-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.tk-tipo{font-size:10px;letter-spacing:.18em;color:var(--dim);font-weight:700;text-transform:uppercase}
.tk-nome{font-size:18px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-hd .grow{flex:1;min-width:0}
.tk-x{padding:7px 10px;border-radius:7px;background:var(--bg3);font-size:12px;font-weight:600;color:var(--dim2);border:1px solid var(--line2);white-space:nowrap}
.tk-x:hover{color:var(--text);border-color:var(--gold)}
.tk-itens{flex:1;overflow-y:auto}
.tk-vazio{color:var(--dim);text-align:center;padding:50px 20px;font-size:13px;line-height:1.6}
.tk-vazio .ico{font-size:34px;opacity:.5;display:block;margin-bottom:8px}
.it{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.it.novo{animation:flash .6s}
@keyframes flash{from{background:var(--goldbg)}to{background:transparent}}
.it .n{font-size:13px;font-weight:600;line-height:1.3}
.it .n small{display:block;color:var(--dim);font-weight:500;font-size:11px}
.it .n .avulso{color:var(--orange)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:30px;height:30px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);font-size:17px;font-weight:700;line-height:1}
.qty button:hover{border-color:var(--gold)}
.qty span{min-width:28px;text-align:center;font-weight:800;font-family:'JetBrains Mono',monospace}
.it .v{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:78px;text-align:right}
.it .rm{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.it .rm button{color:var(--red);font-size:11px;font-weight:600;opacity:.7}
.it .rm button:hover{opacity:1}
.tk-ft{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg)}
.ln{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim2);padding:3px 0}
.ln b{font-family:'JetBrains Mono',monospace;color:var(--text);font-weight:700}
.ln .lk{color:var(--gold);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.ln.desc b{color:var(--gold2)}
.ln.pago b{color:var(--green)}
.total-box{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 2px;padding-top:8px;border-top:1px dashed var(--line2)}
.total-box .l{font-size:12px;letter-spacing:.15em;color:var(--dim);font-weight:700}
.total-box .l small{display:block;letter-spacing:.02em;font-weight:500;font-size:11px}
.total-box .t{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:var(--gold);line-height:1}
.cartao-ln{text-align:right;font-size:12px;color:var(--dim2);margin-bottom:10px}
.cartao-ln b{font-family:'JetBrains Mono',monospace;color:var(--blue)}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pay button{padding:14px 4px;border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.04em;color:#111;display:flex;flex-direction:column;align-items:center;gap:2px}
.pay button kbd{font-family:'JetBrains Mono',monospace;font-size:9.5px;opacity:.65;font-weight:500}
.pay .pix{background:var(--green)}
.pay .din{background:var(--orange)}
.pay .car{background:var(--blue)}
.pay button:disabled{opacity:.35;cursor:not-allowed}
.acoes{display:flex;gap:6px;margin-top:6px}
.acoes button{flex:1;padding:10px 6px;border-radius:8px;background:var(--bg3);border:1px solid var(--line2);font-size:12px;font-weight:700}
.acoes button:hover{border-color:var(--gold);color:var(--gold)}
.acoes .abrir{background:#2a7f9a;border-color:#2a7f9a;color:#fff}
.acoes .abrir:hover{filter:brightness(1.1);color:#fff}

/* modais */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.md{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:440px;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.md.lg{max-width:640px}
.md-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.md-hd h3{font-size:18px;font-weight:800}
.md-hd .x{font-size:24px;color:var(--dim);line-height:1;padding:0 4px}
.md-bd{padding:18px 20px;overflow-y:auto}
.md-ft{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg)}
.md-ft button{flex:1;padding:14px;border-radius:9px;font-weight:800;font-size:14px}
.b-sec{background:var(--bg3);border:1px solid var(--line2)!important;color:var(--dim2)}
.b-ok{background:var(--gold);color:#111}
.b-ok:disabled{opacity:.5;cursor:wait}
.b-ok.pix{background:var(--green)}.b-ok.car{background:var(--blue)}.b-ok.din{background:var(--orange)}
.b-red{background:transparent;border:1px solid var(--red)!important;color:var(--red)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;letter-spacing:.12em;color:var(--dim2);margin-bottom:6px;text-transform:uppercase;font-weight:600}
.fld .hint{font-size:11px;color:var(--dim);margin-top:5px}
.row{display:flex;gap:8px}
.big-valor{text-align:center;margin:4px 0 16px}
.big-valor .l{font-size:11px;letter-spacing:.18em;color:var(--dim);font-weight:700}
.big-valor .v{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--gold);line-height:1.15}
.big-valor .s{font-size:12px;color:var(--dim2)}
.troco{text-align:center;font-size:15px;font-weight:700;padding:12px;border-radius:9px;margin-top:-4px;margin-bottom:14px}
.troco.ok{background:var(--greenbg);color:var(--green)}
.troco.falta{background:var(--redbg);color:var(--red)}
.notas{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.notas button{padding:8px 12px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px}
.notas button:hover{border-color:var(--gold)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.qr-wrap canvas{background:#fff;border-radius:8px;padding:6px}
.qr-wrap .cc{display:flex;gap:6px;width:100%}
.qr-wrap .cc input{font-size:11px;font-family:'JetBrains Mono',monospace;padding:8px}
.qr-wrap .cc button{padding:8px 14px;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;font-weight:700;font-size:12px}
.aviso{background:var(--redbg);color:var(--red);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.aviso.info{background:var(--bluebg);color:var(--blue)}
.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.var-grid button{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:12px 10px;text-align:left}
.var-grid button:hover{border-color:var(--gold)}
.var-grid b{display:block;font-size:13px;margin-bottom:4px}
.var-grid span{font-size:11px;color:var(--dim2);font-family:'JetBrains Mono',monospace}
.var-grid .zero{opacity:.55}
.var-grid .zero span{color:var(--red)}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:10px;font-weight:700;font-size:13px;color:var(--dim2)}
.seg button.on{background:var(--gold);color:#111}
.pg-list{margin-top:12px}
.pg-list .pg{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line2)}
.pg-list .pg b{font-family:'JetBrains Mono',monospace;color:var(--green)}
.pg-list .pg button{color:var(--red);font-size:12px;font-weight:700;margin-left:10px}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--gold);color:var(--text);padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.green{border-color:var(--green)}#toast.red{border-color:var(--red)}

/* ── TELA DO CLIENTE ── */
#telaCliente{position:fixed;inset:0;background:radial-gradient(circle at 80% 0%,#1d1a12,#0b0b0c 55%);display:grid;grid-template-columns:1.3fr 1fr;z-index:600}
.cl-esq{padding:40px 44px;display:flex;flex-direction:column;min-height:0}
.cl-brand{font-family:'Cormorant Garamond',serif;font-size:38px;color:var(--gold);margin-bottom:4px}
.cl-brand em{font-style:italic}
.cl-sub{color:var(--dim);letter-spacing:.2em;font-size:12px;margin-bottom:28px;text-transform:uppercase}
.cl-itens{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.cl-it{display:flex;justify-content:space-between;gap:20px;font-size:22px;padding:12px 0;border-bottom:1px solid var(--line)}
.cl-it span:first-child{font-weight:600}
.cl-it .q{color:var(--gold);font-family:'JetBrains Mono',monospace;margin-right:12px}
.cl-it b{font-family:'JetBrains Mono',monospace}
.cl-dir{background:rgba(0,0,0,.35);border-left:1px solid var(--line);padding:40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.cl-lbl{font-size:14px;letter-spacing:.25em;color:var(--dim);font-weight:700}
.cl-total{font-family:'JetBrains Mono',monospace;font-size:clamp(48px,7vw,92px);color:var(--gold);font-weight:700;line-height:1}
.cl-cartao{font-size:20px;color:var(--dim2)}
.cl-cartao b{font-family:'JetBrains Mono',monospace;color:var(--blue)}
.cl-det{font-size:16px;color:var(--dim2);line-height:1.7}
.cl-qr canvas{background:#fff;border-radius:12px;padding:10px;margin-top:10px}
.cl-msg{font-family:'Cormorant Garamond',serif;font-size:44px;color:var(--gold)}

@media print{body *{visibility:hidden}#impressao,#impressao *{visibility:visible}#impressao{position:absolute;left:0;top:0;width:72mm;color:#000;font-family:monospace;font-size:12px}}
#impressao{display:none}
@media print{#impressao{display:block}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="telaLogin" class="hidden">
  <form class="login-box" onsubmit="return entrar(event)">
    <h1>club <em>alpha</em></h1>
    <p>PONTO DE VENDA</p>
    <label for="lgEmail">E-mail</label>
    <input id="lgEmail" type="email" autocomplete="username" required />
    <label for="lgSenha">Senha</label>
    <input id="lgSenha" type="password" autocomplete="current-password" required />
    <div class="login-erro" id="lgErro"></div>
    <button type="submit" class="b-ok" id="lgBtn" style="width:100%;padding:14px;border-radius:9px;font-weight:800">ENTRAR</button>
    <div style="font-size:11px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.5">Use o mesmo acesso da retaguarda.<br>O login fica salvo neste computador.</div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">club <em>alpha</em></div>
    <button class="tb-btn" id="btnVender" onclick="irVender()">🛒 Vender</button>
    <button class="tb-btn" id="btnComandas" onclick="irComandas()">📋 Comandas <span class="cnt" id="cntComandas">0</span> <kbd>F4</kbd></button>
    <div class="tb-spacer"></div>
    <button class="tb-btn" onclick="abrirTelaCliente()" title="Abre uma janela para o cliente acompanhar a conta (arraste para o 2º monitor ou vire a tela)">📺 Tela do cliente</button>
    <div class="tb-info"><span class="sync" id="syncDot" title="Conectado"></span><b id="opNome">—</b><br><span id="relogio"></span></div>
    <button class="tb-btn" onclick="sair()" title="Sair">⎋</button>
  </header>

  <div class="main">
    <nav class="cats" id="cats"></nav>

    <section class="centro" id="viewVender">
      <div class="busca-bar">
        <input class="busca" id="busca" placeholder="Buscar produto…  (F2)" autocomplete="off" />
        <input class="cod mono" id="codigo" placeholder="Código / barras ↵" autocomplete="off" inputmode="numeric" />
        <label class="chk"><input type="checkbox" id="soEstoque" checked /> só com estoque</label>
        <button class="btn-avulso" onclick="abrirAvulso()">+ Avulso</button>
      </div>

function lsGet(k,def){try{const v=localStorage.getItem(k);return v===null?def:JSON.parse(v);}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ── UTIL ──
const r2 = v => Math.round((Number(v)||0)*100)/100;
function fmt(v){return 'R$ '+r2(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function $(id){return document.getElementById(id);}
function uid(){return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);}));}
function minutos(d){const m=Math.floor((Date.now()-new Date(d).getTime())/60000);if(m<1)return'agora';if(m<60)return m+' min';const h=Math.floor(m/60);return h<24?h+'h'+String(m%60).padStart(2,'0'):Math.floor(h/24)+'d';}
let toastT;
function toast(msg,tipo=''){const el=$('toast');el.textContent=msg;el.className='show '+tipo;clearTimeout(toastT);toastT=setTimeout(()=>el.className='',2600);}
function valido(v){return typeof v==='number'&&isFinite(v)&&v>0;}

// Mesma regra de preço do site: cartão paga o preço de venda (promo,
// quando menor); Pix/dinheiro paga o preço Pix, quando menor.
function precosDe(p,v){
  if(v&&valido(Number(v.preco))){const x=Number(v.preco);return{pv:x,pc:x};}
  const cheio=Number(p.preco)||0, promo=Number(p.preco_promocional), pix=Number(p.preco_pix);
  const venda=(valido(promo)&&promo<cheio)?promo:cheio;
  const vista=(valido(pix)&&pix<venda)?pix:venda;
  return{pv:vista,pc:venda};
}

// ── TICKETS (balcão e comandas) ──
function novoTicket(nome,taxa){return{id:null,nome,itens:[],pagamentos:[],descontoTipo:'valor',descontoValor:0,taxa:taxa||0,whats:'',aberta_em:new Date().toISOString(),aberta_por:'',numeroPendente:null};}
function ticketAtual(){return S.alvo==='balcao'?S.balcao:S.comandas[S.alvo];}

function totais(t,forma){
  const campo=forma==='cartao'?'pc':'pv';
  const sub=r2(t.itens.reduce((s,i)=>s+i[campo]*i.qtd,0));
  const taxa=r2(sub*(Number(t.taxa)||0)/100);
  const base=r2(sub+taxa);
  const dv=Math.max(0,Number(t.descontoValor)||0);
  const desconto=Math.min(base,r2(t.descontoTipo==='percent'?base*dv/100:dv));
  const total=r2(base-desconto);
  const pago=r2(t.pagamentos.reduce((s,p)=>s+Number(p.valor||0),0));
  const restante=r2(Math.max(0,total-pago));
  const qtd=t.itens.reduce((s,i)=>s+i.qtd,0);
  return{sub,taxa,desconto,total,pago,restante,qtd};
}

function salvarTicket(t,{imediato=false}={}){
  if(!t)return;
  if(t===S.balcao){lsSet(LS.balcao,S.balcao);transmitirCliente();return;}
  lsSet(LS.comandasCache,S.comandas);
  transmitirCliente();
  clearTimeout(S.salvando.get(t.id));
  S.salvando.set(t.id,setTimeout(()=>gravarComanda(t.id),imediato?0:500));
}

// ── DADOS ──
async function carregarProdutos(silencioso){
  try{
    const [pr,ct]=await Promise.all([
      sb.from('produtos').select('id,codigo,codigo_barras,nome,marca,preco,preco_pix,preco_promocional,estoque,categoria_id,subcategoria,variacoes(id,nome,preco,estoque,ativo,ordem)').eq('ativo',true).limit(3000),
      sb.from('categorias').select('id,nome,ordem,ativo').order('ordem',{ascending:true}),
    ]);
    if(pr.error)throw pr.error;
    S.prods=(pr.data||[]).map(p=>{
      p.variacoes=(p.variacoes||[]).filter(v=>v.ativo).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
      p._busca=norm([p.codigo,p.nome,p.marca,p.subcategoria,p.codigo_barras].join(' '));
      return p;
    }).sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome)));
    S.prodById=new Map(S.prods.map(p=>[p.id,p]));
    S.cats=(ct.data||[]).filter(c=>c.ativo!==false);
    setOnline(true);
    renderCats();renderGrid();
  }catch(e){
    console.warn('Produtos:',e);setOnline(false);
    if(!silencioso)$('grid').innerHTML='<div class="vazio"><b>Não consegui carregar os produtos</b>Confira a internet. <button class="lk" onclick="carregarProdutos()" style="color:var(--gold);text-decoration:underline">Tentar de novo</button></div>';
  }
}
async function carregarPix(){
  const {data}=await sb.from('configuracoes').select('chave,valor').in('chave',['loja_pix_chave','loja_pix_nome','loja_pix_cidade']);
  const m={};(data||[]).forEach(r=>m[r.chave]=r.valor);
  S.pix={chave:m.loja_pix_chave||'',nome:m.loja_pix_nome||'',cidade:m.loja_pix_cidade||''};
}
function setOnline(v){S.online=v;const d=$('syncDot');if(d){d.classList.toggle('off',!v);d.title=v?'Conectado':'Sem conexão com o servidor — tentando de novo';}}

// Comandas ficam na tabela pdv_comandas: abrem em qualquer computador e
// não somem se o navegador for limpo.
function comandaDoBanco(r){
  return{id:r.id,nome:r.nome,itens:r.itens||[],pagamentos:r.pagamentos||[],descontoTipo:r.desconto_tipo||'valor',descontoValor:Number(r.desconto_valor)||0,taxa:Number(r.taxa_percent)||0,whats:r.cliente_whatsapp||'',aberta_em:r.aberta_em,aberta_por:r.aberta_por||'',atualizado_em:r.atualizado_em,numeroPendente:null};
}
function comandaParaBanco(t){
  return{id:t.id,nome:t.nome,itens:t.itens,pagamentos:t.pagamentos,desconto_tipo:t.descontoTipo,desconto_valor:t.descontoValor,taxa_percent:t.taxa,cliente_whatsapp:t.whats||null,aberta_em:t.aberta_em,aberta_por:t.aberta_por,atualizado_em:new Date().toISOString(),status:'aberta'};
}
async function gravarComanda(id){
  S.salvando.delete(id);
  const t=S.comandas[id];if(!t)return;
  const row=comandaParaBanco(t);
  const {error}=await sb.from('pdv_comandas').upsert(row);
  if(error){console.warn('Comanda:',error);setOnline(false);t._pendente=true;return;}
  t._pendente=false;t.atualizado_em=row.atualizado_em;setOnline(true);
}
async function sincronizarComandas(manual){
  // Primeiro sobe o que ficou pendente (internet caiu).
  for(const t of Object.values(S.comandas)){if(t._pendente)await gravarComanda(t.id);}
  const {data,error}=await sb.from('pdv_comandas').select('*').eq('status','aberta').order('aberta_em');
  if(error){setOnline(false);if(manual)toast('Sem conexão com o servidor','red');return;}
  setOnline(true);
  const novas={};
  for(const r of data){
    const local=S.comandas[r.id];
    // Mantém a versão local se ela tem alteração ainda não gravada.
    if(local&&(S.salvando.has(r.id)||local._pendente))novas[r.id]=local;
    else novas[r.id]=comandaDoBanco(r);
  }
  // Comanda local que ainda não subiu (criada offline) continua.
  for(const t of Object.values(S.comandas)){if(t._pendente&&!novas[t.id])novas[t.id]=t;}
  const alvoSumiu=S.alvo!=='balcao'&&!novas[S.alvo];
  S.comandas=novas;lsSet(LS.comandasCache,S.comandas);
  if(alvoSumiu){S.alvo='balcao';toast('A comanda foi fechada em outro computador');}
  renderTicket();renderContagem();if(S.view==='comandas')renderComandas();
  if(manual)toast('Comandas atualizadas','green');
}
// Comandas da versão antiga (salvas só no navegador) sobem uma vez.
async function migrarComandasAntigas(){
  const antigas=lsGet(LS.legado,null);if(!antigas||!Object.keys(antigas).length)return;
  let n=0;
  for(const c of Object.values(antigas)){
    const t=novoTicket(c.nome,0);t.id=uid();t.aberta_em=c.hora||t.aberta_em;t.aberta_por=S.user.email;
    t.itens=(c.itens||[]).map(i=>({key:'leg'+i.id,produto_id:i.tipo==='p'?Number(i.id)||null:null,variacao_id:null,codigo:'',nome:i.nome,variacao:'',pv:Number(i.preco),pc:Number(i.preco),qtd:i.qtd,avulso:i.tipo!=='p'}));
    t.pagamentos=(c.pagamentos||[]).map(p=>({valor:p.valor,forma:p.forma==='parcial'?'dinheiro':p.forma,ts:p.ts}));
    t.descontoTipo=c.descontoTipo||'valor';t.descontoValor=Number(c.descontoValor)||0;
    S.comandas[t.id]=t;await gravarComanda(t.id);n++;
  }
  try{localStorage.removeItem(LS.legado);}catch(e){}
  if(n)toast(n+' comanda(s) da versão antiga importadas','green');
}

// ── CATEGORIAS ──
function prodsDaCat(catId){return S.prods.filter(p=>p.categoria_id===catId);}
function renderCats(){
  const el=$('cats');
  if(S.catSel!=='todos'&&S.catSel!=='servicos'&&S.subSel!==undefined){
    const cat=S.cats.find(c=>c.id===S.catSel);
    if(cat){
      const subs={};prodsDaCat(cat.id).forEach(p=>{const s=(p.subcategoria||'Outros').trim();subs[s]=(subs[s]||0)+1;});
      const nomes=Object.keys(subs).sort((a,b)=>norm(a).localeCompare(norm(b)));
      el.innerHTML=`<button class="cat voltar" data-cat="todos">‹ Todas</button>
        <button class="cat ${S.subSel===null?'ativo':''}" data-sub="">${esc(cat.nome)}<small>${prodsDaCat(cat.id).length}</small></button>
        <div class="cat-sep"></div>`+
        nomes.map(n=>`<button class="cat ${S.subSel===n?'ativo':''}" data-sub="${esc(n)}" style="font-size:11.5px">${esc(n)}<small>${subs[n]}</small></button>`).join('');
      return;
    }
  }
  el.innerHTML=`<button class="cat ${S.catSel==='todos'?'ativo':''}" data-cat="todos">Todos</button>`+
    S.cats.filter(c=>prodsDaCat(c.id).length).map(c=>`<button class="cat ${S.catSel===c.id?'ativo':''}" data-cat="${c.id}">${esc(c.nome)}<small>›</small></button>`).join('')+
    `<div class="cat-sep"></div><button class="cat ${S.catSel==='servicos'?'ativo':''}" data-cat="servicos">Rosh · Doses · Club</button>`;
}

// ── GRADE DE PRODUTOS ──
function itensVisiveis(){
  const termos=norm(S.busca).split(/\s+/).filter(Boolean);
  if(S.catSel==='servicos'&&!termos.length)return SERVICOS.map(s=>({tipo:'s',s}));
  let lista=S.prods;
  if(termos.length){
    lista=lista.filter(p=>termos.every(t=>p._busca.includes(t)));
    const serv=SERVICOS.filter(s=>termos.every(t=>norm(s.nome+' '+s.grupo).includes(t)));
    return [...serv.map(s=>({tipo:'s',s})),...lista.slice(0,200).map(p=>({tipo:'p',p}))];
  }
  if(S.catSel!=='todos')lista=lista.filter(p=>p.categoria_id===S.catSel);
  if(S.subSel)lista=lista.filter(p=>(p.subcategoria||'Outros').trim()===S.subSel);
  if(S.soEstoque)lista=lista.filter(p=>(Number(p.estoque)||0)>0);
  return lista.map(p=>({tipo:'p',p}));
}
function qtdNoTicket(prodId){const t=ticketAtual();if(!t)return 0;return t.itens.filter(i=>i.produto_id===prodId).reduce((s,i)=>s+i.qtd,0);}
function renderGrid(){
  const el=$('grid');if(!el)return;
  const itens=itensVisiveis();
  if(!itens.length){
    el.innerHTML=`<div class="vazio"><b>Nenhum produto ${S.busca?'para “'+esc(S.busca)+'”':'aqui'}</b>${S.soEstoque&&!S.busca?'Desmarque “só com estoque” para ver os zerados.':'Use “+ Avulso” para lançar algo fora do catálogo.'}</div>`;
    return;
  }
  el.innerHTML=itens.map(x=>{
    if(x.tipo==='s'){const s=x.s;return`<button class="tile" data-serv="${s.id}"><div class="nome">${esc(s.nome)}</div><div class="preco">${fmt(s.preco)}</div><div class="est">${esc(s.grupo)} · serviço</div></button>`;}
    const p=x.p, est=Number(p.estoque)||0, {pv,pc}=precosDe(p), q=qtdNoTicket(p.id), temVar=p.variacoes.length>0;
    return`<button class="tile ${est<=0?'zerado':''}" data-prod="${p.id}">
      ${q?`<span class="qtd-no-ticket">${q}</span>`:''}
      <div class="nome">${p.codigo?`<span class="cod">${esc(p.codigo)} · </span>`:''}${esc(p.nome)}</div>
      <div class="preco">${temVar&&p.variacoes.some(v=>valido(Number(v.preco)))?'a partir de ':''}${fmt(pv)}${pc!==pv?`<small>cartão ${fmt(pc)}</small>`:''}</div>
      ${est<=0?'<div class="sem">SEM ESTOQUE</div>':`<div class="est ${est<=2?'baixo':''}">${temVar?'<span class="var-tag">'+p.variacoes.length+' opções · </span>':''}${est} em estoque</div>`}
    </button>`;
  }).join('');
}

// ── LANÇAR ITENS ──
function clicarProduto(id){
  const p=S.prodById.get(id);if(!p)return;
  if(p.variacoes.length){abrirVariacoes(p);return;}
  adicionar(p,null);
}
function adicionar(p,v,qtd=1){
  const t=ticketAtual();
  const est=v?Number(v.estoque):Number(p.estoque);
  const jaNoTicket=t.itens.filter(i=>i.produto_id===p.id&&(i.variacao_id||null)===(v?v.id:null)).reduce((s,i)=>s+i.qtd,0);
  if((Number(est)||0)-jaNoTicket<qtd){
    if(!confirm(`“${p.nome}${v?' · '+v.nome:''}” está com ${est||0} no estoque do sistema.\n\nSe o produto está na sua mão, o estoque cadastrado está errado. Vender mesmo assim?\n(o estoque fica negativo e aparece em vermelho na retaguarda para recontar)`))return;
  }
  const {pv,pc}=precosDe(p,v);
  const key='p'+p.id+'-'+(v?v.id:'');
  const ex=t.itens.find(i=>i.key===key);
  if(ex)ex.qtd+=qtd;
  else t.itens.push({key,produto_id:p.id,variacao_id:v?v.id:null,codigo:p.codigo||'',nome:p.nome,variacao:v?v.nome:'',pv,pc,qtd});
  ultimoKey=key;
  salvarTicket(t);renderTicket();renderGrid();
  toast('+ '+p.nome+(v?' · '+v.nome:''),'green');
}
function adicionarServico(id){
  const s=SERVICOS.find(x=>x.id===id);if(!s)return;
  const t=ticketAtual();const key='s-'+s.nome;
  const ex=t.itens.find(i=>i.key===key);
  if(ex)ex.qtd++;else t.itens.push({key,produto_id:null,variacao_id:null,codigo:'',nome:s.nome,variacao:'',pv:s.preco,pc:s.preco,qtd:1,servico:true});
  ultimoKey=key;salvarTicket(t);renderTicket();toast('+ '+s.nome,'green');
}
let ultimoKey=null;
function alterarQtd(key,d){
  const t=ticketAtual();const it=t.itens.find(i=>i.key===key);if(!it)return;
  if(d>0&&it.produto_id){
    const p=S.prodById.get(it.produto_id);const v=p&&it.variacao_id?p.variacoes.find(x=>x.id===it.variacao_id):null;

    if(p&&it.qtd+d>(Number(est)||0)&&!confirm(`O sistema tem ${est||0} de “${it.nome}”. Lançar mesmo assim?`))return;
  }
  it.qtd+=d;if(it.qtd<=0)t.itens=t.itens.filter(i=>i!==it);
  salvarTicket(t);renderTicket();renderGrid();
}

function modal(html,{lg=false,onClose}={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md ${lg?'lg':''}">${html}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)fechar();});
  function fechar(){ov.remove();onClose&&onClose();}
  ov._fechar=fechar;
  $('modais').appendChild(ov);
  const f=ov.querySelector('[autofocus]');if(f)setTimeout(()=>{f.focus();f.select&&f.select();},40);
  return ov;
}

// ── PIX (BR Code) ──
function asciiPix(t,lim){const s=String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').replace(/\s+/g,' ').trim().toUpperCase();return lim?s.slice(0,lim):s;}
function campo(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v;}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=(s.charCodeAt(i)&0xFF)<<8;for(let b=0;b<8;b++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
function pixCopiaECola(valor,txid){
  const {chave,nome,cidade}=S.pix;if(!chave||!nome||!cidade)return'';
  const id=asciiPix(txid,25).replace(/[^A-Z0-9]/g,'')||'***';
  const p=campo('00','01')+campo('26',campo('00','br.gov.bcb.pix')+campo('01',chave.trim()))+campo('52','0000')+campo('53','986')+(valor>0?campo('54',valor.toFixed(2)):'')+campo('58','BR')+campo('59',asciiPix(nome,25))+campo('60',asciiPix(cidade,15))+campo('62',campo('05',id));
  return p+'6304'+crc16(p+'6304');
}

  const valor=x.restante;
  const pix=forma==='pix'?pixCopiaECola(valor,t.numeroPendente):'';
  const ov=modal(hd(`Finalizar no ${NOMES_FORMA[forma]}`)+`
    <div class="md-bd">
      <div class="big-valor"><div class="l">${x.pago?'FALTA RECEBER':'TOTAL A RECEBER'}</div><div class="v">${fmt(valor)}</div>
        <div class="s">${x.qtd} ${x.qtd===1?'item':'itens'} · ${S.alvo==='balcao'?'Balcão':esc(t.nome)}${x.desconto?' · desconto '+fmt(x.desconto):''}${x.taxa?' · taxa '+fmt(x.taxa):''}${x.pago?' · já pago '+fmt(x.pago):''}</div></div>
      ${forma==='pix'?(pix?`<div class="qr-wrap"><canvas id="fzQr"></canvas><div style="font-size:12px;color:var(--dim2)">O QR também aparece na tela do cliente</div><div class="cc"><input readonly value="${esc(pix)}" id="fzPix" /><button id="fzCopiar">Copiar</button></div></div>`:'<div class="aviso">Chave Pix da loja não configurada (retaguarda → Config). Confirme o Pix no app do banco.</div>'):''}
      ${forma==='dinheiro'?`<div class="fld"><label>Valor recebido (R$)</label><input id="fzRec" type="number" step="0.01" min="0" inputmode="decimal" autofocus placeholder="${r2(valor).toFixed(2)}" /></div>
        <div class="notas">${[valor,50,100,200].filter((v,i,a)=>v>=valor&&a.indexOf(v)===i).map(v=>`<button data-n="${v}">${fmt(v)}</button>`).join('')}</div>
        <div class="troco ok" id="fzTroco">Sem troco</div>`:''}
      ${forma==='cartao'?`<div class="aviso info">Passe o cartão na maquininha e só confirme aqui depois de aprovado.</div>`:''}
      <div class="row">
        <div class="fld" style="flex:1"><label>Cliente (opcional)</label><input id="fzNome" value="${S.alvo==='balcao'?'':esc(t.nome)}" placeholder="Balcão" /></div>
        <div class="fld" style="flex:1"><label>WhatsApp · Alpha Club</label><input id="fzWhats" inputmode="tel" value="${esc(t.whats||'')}" placeholder="soma pontos" /></div>
      </div>
      <div class="aviso hidden" id="fzErro"></div>
    </div>
    <div class="md-ft"><button class="b-sec" onclick="fecharModalTopo()">Voltar (Esc)</button><button class="b-ok ${forma==='pix'?'pix':forma==='cartao'?'car':'din'}" id="fzOk" ${forma!=='dinheiro'?'autofocus':''}>✓ Confirmar venda ↵</button></div>`,
    {onClose:()=>transmitirCliente()});
  if(forma==='pix'&&pix){
    if(window.QRCode)QRCode.toCanvas(ov.querySelector('#fzQr'),pix,{width:210,margin:1});
    ov.querySelector('#fzCopiar').onclick=()=>{navigator.clipboard.writeText(pix);toast('Copia e cola copiado','green');};
    transmitirCliente({pix,valor});
  }else transmitirCliente({forma,valor});
  if(forma==='dinheiro'){
    const rec=ov.querySelector('#fzRec'),tr=ov.querySelector('#fzTroco');
    const calc=()=>{const v=Number(rec.value)||0;if(!rec.value){tr.className='troco ok';tr.textContent='Sem troco';return;}const d=r2(v-valor);tr.className='troco '+(d>=0?'ok':'falta');tr.textContent=d>=0?'TROCO: '+fmt(d):'Faltam '+fmt(-d);};
    rec.oninput=calc;ov.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{rec.value=Number(b.dataset.n).toFixed(2);calc();});
  }
  const btn=ov.querySelector('#fzOk');
  async function confirmar(){
    if(btn.disabled)return;
    if(forma==='dinheiro'){const v=Number(ov.querySelector('#fzRec').value);if(ov.querySelector('#fzRec').value&&v<valor){toast('Valor recebido menor que o total','red');return;}}
    btn.disabled=true;btn.textContent='Gravando…';
    const nome=ov.querySelector('#fzNome').value.trim(),whats=ov.querySelector('#fzWhats').value.trim();
    const res=await finalizarVenda(t,forma,nome,whats);
    if(!res.ok){btn.disabled=false;btn.textContent='✓ Tentar de novo';const e=ov.querySelector('#fzErro');e.classList.remove('hidden');e.textContent=res.erro;return;}
    ov.remove();
    if(forma==='dinheiro'){const v=Number(ov.querySelector('#fzRec').value)||0;if(v>valor)toast('Venda registrada · TROCO '+fmt(v-valor),'green');else toast('✓ Venda registrada · '+fmt(valor),'green');}
    else toast('✓ Venda registrada · '+fmt(valor)+' · '+NOMES_FORMA[forma],'green');
    if(res.negativos&&res.negativos.length)setTimeout(()=>alert('Atenção: estes produtos ficaram com estoque NEGATIVO no sistema — a contagem está errada, confira na prateleira:\n\n'+res.negativos.map(n=>'• '+n.nome+' ('+n.estoque+')').join('\n')),300);
  }
  btn.onclick=confirmar;
}
async function finalizarVenda(t,forma,nome,whats){
  const x=totais(t,forma);const campoP=forma==='cartao'?'pc':'pv';
  const ehBalcao=S.alvo==='balcao';
  const partes=['PDV',ehBalcao?'BALCÃO':'Comanda '+t.nome,NOMES_FORMA[forma].toUpperCase()];
  if(x.taxa)partes.push(`Taxa ${t.taxa}%: ${fmt(x.taxa)}`);
  if(x.desconto)partes.push('Desconto: '+fmt(x.desconto));
  if(t.pagamentos.length)partes.push('Pagamentos parciais: '+t.pagamentos.map(p=>p.forma.toUpperCase()+' '+fmt(p.valor)).join(' + ')+' · restante '+NOMES_FORMA[forma].toUpperCase()+' '+fmt(x.restante));
  const avulsos=t.itens.filter(i=>i.avulso);if(avulsos.length)partes.push('Avulsos: '+avulsos.map(i=>i.nome).join(', '));
  partes.push('Operador: '+(S.user.email||''));
  const payload={
    numero:t.numeroPendente, comanda_id:ehBalcao?null:t.id,
    cliente_nome:nome||(ehBalcao?'Balcão':t.nome), cliente_whatsapp:whats,
    forma_pagamento:forma,
    subtotal:x.sub, total:x.total, observacoes:partes.join(' · '),
    itens:t.itens.map(i=>({produto_id:i.produto_id,variacao_id:i.variacao_id,nome:i.nome+(i.variacao?' · '+i.variacao:''),codigo:i.codigo||null,qtd:i.qtd,preco:i[campoP]})),
  };
  // Garante que a comanda está gravada antes de fechar.
  if(!ehBalcao&&S.salvando.has(t.id)){clearTimeout(S.salvando.get(t.id));await gravarComanda(t.id);}
  const {data,error}=await sb.rpc('pdv_finalizar_venda',{p:payload});
  if(error){
    console.warn('Venda:',error);setOnline(false);
    return{ok:false,erro:/fetch|network|Failed/i.test(error.message)?'Sem internet. A venda NÃO foi gravada. Confira a conexão e tente de novo (não duplica).':'Erro ao gravar: '+error.message};
  }
  setOnline(true);
  if(ehBalcao){S.balcao=novoTicket('Balcão',0);lsSet(LS.balcao,S.balcao);}
  else{clearTimeout(S.salvando.get(t.id));S.salvando.delete(t.id);delete S.comandas[t.id];lsSet(LS.comandasCache,S.comandas);S.alvo='balcao';}
  transmitirCliente({fim:true,valor:x.restante});
  renderTicket();renderContagem();if(S.view==='comandas')renderComandas();
  carregarProdutos(true);
  return{ok:true,negativos:data&&data.negativos};
}

// ── IMPRIMIR CONTA (conferência para o cliente) ──
function imprimirConta(){
  const t=ticketAtual();if(!t.itens.length){toast('Nada para imprimir');return;}
  const v=totais(t,'pix'),c=totais(t,'cartao');
  $('impressao').innerHTML=`<div style="text-align:center;font-weight:bold;font-size:15px">CLUB ALPHA</div><div style="text-align:center">conferência de conta — não é documento fiscal</div><hr>
    <div>${esc(S.alvo==='balcao'?'Balcão':t.nome)} · ${new Date().toLocaleString('pt-BR')}</div><hr>
    ${t.itens.map(i=>`<div>${i.qtd}x ${esc(i.nome)}${i.variacao?' '+esc(i.variacao):''}</div><div style="text-align:right">${fmt(i.pv*i.qtd)}</div>`).join('')}<hr>
    <div>Subtotal: ${fmt(v.sub)}</div>${v.taxa?`<div>Taxa serviço ${t.taxa}%: ${fmt(v.taxa)}</div>`:''}${v.desconto?`<div>Desconto: -${fmt(v.desconto)}</div>`:''}${v.pago?`<div>Já pago: -${fmt(v.pago)}</div>`:''}
    <div style="font-size:15px;font-weight:bold">TOTAL PIX/DINHEIRO: ${fmt(v.pago?v.restante:v.total)}</div>${c.total!==v.total?`<div>No cartão: ${fmt(c.pago?c.restante:c.total)}</div>`:''}<hr><div style="text-align:center">obrigado!</div>`;
  window.print();
}

// ── TELA DO CLIENTE ──
// Uma segunda janela (outro monitor ou a tela virada para o cliente)
// mostra os itens e o total ao vivo, e o QR do Pix na hora de pagar.
let extraCliente=null;
function abrirTelaCliente(){window.open(location.pathname+'#cliente','pdvCliente','popup,width=1100,height=700');setTimeout(()=>transmitirCliente(),800);}
function transmitirCliente(extra){
  if(MODO_CLIENTE)return;
  if(extra!==undefined)extraCliente=extra||null;
  const t=ticketAtual();if(!t)return;
  const v=totais(t,'pix'),c=totais(t,'cartao');
  const estado={nome:S.alvo==='balcao'?'':t.nome,itens:t.itens.map(i=>({n:i.nome+(i.variacao?' · '+i.variacao:''),q:i.qtd,v:r2(i.pv*i.qtd)})),sub:v.sub,taxa:v.taxa,taxaP:t.taxa,desconto:v.desconto,pago:v.pago,total:v.pago?v.restante:v.total,cartao:c.pago?c.restante:c.total,extra:extraCliente,ts:Date.now()};
  if(extraCliente&&extraCliente.fim)extraCliente=null;
  lsSet(LS.cliente,estado);
  if(canal)canal.postMessage(estado);
}
function iniciarTelaCliente(){
  document.title='Club Alpha · Sua conta';
  $('telaCliente').classList.remove('hidden');
  let fimT=null;
  const render=e=>{
    const el=$('telaCliente');
    if(!e){e={itens:[],total:0,cartao:0};}
    if(e.extra&&e.extra.fim){
      el.innerHTML=`<div class="cl-esq"><div class="cl-brand">club <em>alpha</em></div><div class="cl-sub">Alphaville</div></div><div class="cl-dir"><div class="cl-msg">Obrigado!</div><div class="cl-det">Volte sempre ✦</div></div>`;
      clearTimeout(fimT);fimT=setTimeout(()=>render(lsGet(LS.cliente,null)&&{...lsGet(LS.cliente,null),extra:null}),6000);return;
    }
    const ult=e.itens.slice(-9);
    el.innerHTML=`<div class="cl-esq"><div class="cl-brand">club <em>alpha</em></div><div class="cl-sub">${e.nome?'Comanda · '+esc(e.nome):'Sua compra'}</div>
      <div class="cl-itens">${e.itens.length?(e.itens.length>ult.length?`<div class="cl-det" style="margin-bottom:8px">+ ${e.itens.length-ult.length} itens acima</div>`:'')+ult.map(i=>`<div class="cl-it"><span><span class="q">${i.q}×</span>${esc(i.n)}</span><b>${fmt(i.v)}</b></div>`).join(''):'<div class="cl-det" style="font-size:24px">Bem-vindo ✦</div>'}</div></div>
      <div class="cl-dir">
        ${e.extra&&e.extra.pix?`<div class="cl-lbl">PAGUE COM PIX</div><div class="cl-total">${fmt(e.extra.valor)}</div><div class="cl-qr"><canvas id="clQr"></canvas></div><div class="cl-det">Aponte a câmera do app do seu banco</div>`
        :`<div class="cl-lbl">${e.pago?'FALTA PAGAR':'TOTAL'}</div><div class="cl-total">${fmt(e.total)}</div>
          <div class="cl-det">no Pix ou dinheiro</div>
          ${e.cartao!==e.total?`<div class="cl-cartao">no cartão: <b>${fmt(e.cartao)}</b></div>`:''}
          <div class="cl-det" style="margin-top:16px">${e.itens.length?`Produtos ${fmt(e.sub)}`:''}${e.taxa?`<br>Taxa de serviço ${e.taxaP}% ${fmt(e.taxa)}`:''}${e.desconto?`<br>Desconto −${fmt(e.desconto)}`:''}${e.pago?`<br>Já pago −${fmt(e.pago)}`:''}</div>`}
      </div>`;
    if(e.extra&&e.extra.pix&&window.QRCode)QRCode.toCanvas($('clQr'),e.extra.pix,{width:260,margin:1});
  };
  render(lsGet(LS.cliente,null));
  if(canal)canal.onmessage=m=>render(m.data);
  window.addEventListener('storage',ev=>{if(ev.key===LS.cliente)render(lsGet(LS.cliente,null));});
  document.addEventListener('dblclick',()=>{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();});
}

// ── EVENTOS E ATALHOS ──
function ligarEventos(){
  $('cats').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.cat!==undefined){const c=b.dataset.cat;S.catSel=(c==='todos'||c==='servicos')?c:Number(c);S.subSel=null;}
    else if(b.dataset.sub!==undefined){S.subSel=b.dataset.sub||null;}
    S.busca='';$('busca').value='';
    if(S.view!=='vender')irVender();
    renderCats();renderGrid();$('grid').scrollTop=0;
  });
  $('grid').addEventListener('click',e=>{
    const b=e.target.closest('.tile');if(!b)return;
    if(b.dataset.prod)clicarProduto(Number(b.dataset.prod));
    else if(b.dataset.serv)adicionarServico(b.dataset.serv);
  });
  $('gridComandas').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)selecionarComanda(b.dataset.cmd);});
  $('ticket').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b)alterarQtd(b.dataset.q,Number(b.dataset.d));});
  let bt;
  $('busca').addEventListener('input',e=>{clearTimeout(bt);bt=setTimeout(()=>{S.busca=e.target.value;renderGrid();$('grid').scrollTop=0;},120);});
  $('busca').addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const v=e.target.value.trim();
      // Leitor de código de barras digita e manda Enter.
      const c=norm(v);const exato=S.prods.find(x=>(x.codigo_barras&&norm(x.codigo_barras)===c)||(x.codigo&&norm(x.codigo)===c));
      if(exato){clicarProduto(exato.id);e.target.value='';S.busca='';renderGrid();return;}
      const it=itensVisiveis();
      if(it.length===1){it[0].tipo==='p'?clicarProduto(it[0].p.id):adicionarServico(it[0].s.id);e.target.select();}
    }
    if(e.key==='Escape'){e.target.value='';S.busca='';renderGrid();}
  });
  $('codigo').addEventListener('keydown',e=>{if(e.key==='Enter')lancarPorCodigo(e.target.value);});
  $('soEstoque').addEventListener('change',e=>{S.soEstoque=e.target.checked;lsSet(LS.soEstoque,S.soEstoque);renderGrid();});
  $('buscaCmd').addEventListener('input',renderComandas);
  $('buscaCmd').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=document.querySelector('#gridComandas [data-cmd]');if(c)selecionarComanda(c.dataset.cmd);}});
  document.addEventListener('keydown',e=>{
    const temModal=!!document.querySelector('.ov');
    if(e.key==='Escape'){if(fecharModalTopo())e.preventDefault();return;}
    if(temModal){
      // Enter confirma o modal aberto (num botão focado o próprio navegador já clica).
      if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='TEXTAREA'){const ok=document.querySelector('.ov:last-child .md-ft .b-ok');if(ok){e.preventDefault();ok.click();}}
      return;
    }
    const k={F2:()=>{irVender();$('busca').focus();},F3:abrirComanda,F4:()=>S.view==='comandas'?irVender():irComandas(),F8:()=>abrirFinalizar('pix'),F9:()=>abrirFinalizar('dinheiro'),F10:()=>abrirFinalizar('cartao')}[e.key];
    if(k){e.preventDefault();k();}
  });
  window.addEventListener('online',()=>sincronizarComandas());
  window.addEventListener('beforeunload',e=>{if([...S.salvando.keys()].length||Object.values(S.comandas).some(c=>c._pendente)){e.preventDefault();e.returnValue='';}});
}
function tick(){const n=new Date();const el=$('relogio');if(el)el.textContent=n.toLocaleDateString('pt-BR')+' · '+n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
setInterval(tick,10000);tick();
iniciar();
</script>
